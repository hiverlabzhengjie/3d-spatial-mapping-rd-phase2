<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Managed scene capture</title>
  <style>
    :root{color-scheme:dark;--bg:#07111a;--panel:#101d29;--line:#2a3b4a;--ink:#f2f7fb;--muted:#9fb1c1;--cyan:#20d6e5;--green:#38d39f;--red:#ff806f;--amber:#ffce73}*{box-sizing:border-box}body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:28px}main{max-width:1240px;margin:auto}h1{font-size:1.8rem;margin:0 0 7px}.intro{color:var(--muted);max-width:850px;margin:0 0 20px}.controls{display:flex;align-items:end;flex-wrap:wrap;gap:10px;margin:0 0 14px}label{display:grid;gap:5px;color:var(--muted);font-size:.87rem}input{width:100px;min-height:42px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#09141e;color:var(--ink)}button{min-height:42px;border:1px solid #1aaaba;border-radius:9px;padding:8px 14px;color:#031115;background:var(--cyan);font:700 .92rem system-ui;cursor:pointer}button.secondary{background:transparent;color:var(--cyan)}button:disabled{opacity:.6;cursor:wait}#summary{min-height:28px;margin:8px 0 14px;color:var(--muted);font-weight:650}.success{color:var(--green)!important}.failure{color:var(--red)!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:13px}.card{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.card.ready{border-color:#268d70}.card.failed{border-color:#a65149}.preview{display:grid;place-items:center;width:100%;aspect-ratio:16/9;background:#050b10;color:#657787}.preview img{display:block;width:100%;height:100%;object-fit:cover}.body{padding:13px}.camera{font-weight:750}.status{margin-top:4px;color:var(--muted)}.detail{min-height:20px;margin-top:6px;color:#8194a5;font-size:.82rem}.result{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.result h2{font-size:1.05rem;margin:0 0 6px}.result p{margin:5px 0;color:var(--muted)}.result code{word-break:break-all;color:var(--ink)}.hidden{display:none}@media(max-width:640px){body{padding:18px}.controls{align-items:stretch}.controls button{width:100%}}
  </style>
</head>
<body>
  <main>
    <h1>Live capture</h1>
    <p class="intro">Check the live camera views, then capture a short session.</p>
    <div class="controls">
      <button id="preview" type="button">Load live previews</button>
      <label>Capture duration (seconds)<input id="duration" type="number" min="0.1" max="30" step="0.1" value="2"></label>
      <button id="capture" type="button">Capture current scene</button>
    </div>
    <div id="summary" role="status">Live cameras have not been checked.</div>
    <div id="cameras" class="grid" aria-live="polite"></div>
    <section id="result" class="result hidden" aria-live="polite"></section>
  </main>
  <script>
    const grid=document.getElementById('cameras');const previewButton=document.getElementById('preview');const captureButton=document.getElementById('capture');const durationInput=document.getElementById('duration');const summary=document.getElementById('summary');const result=document.getElementById('result');const objectUrls=new Map();let cameraIds=[];let currentSession=null;
    function escapeHtml(value){const node=document.createElement('span');node.textContent=String(value);return node.innerHTML}
    function setSummary(message,state=''){summary.className=state;summary.textContent=message}
    function setCard(id,state,message,imageUrl){const card=document.getElementById(`camera-${id}`);if(!card)return;card.className=`card ${state}`;card.querySelector('.status').textContent=state==='ready'?'Ready':state==='failed'?'Unavailable':state==='checking'?'Checking…':'Not checked';card.querySelector('.detail').textContent=message;const area=card.querySelector('.preview');if(imageUrl){area.innerHTML='';const image=document.createElement('img');image.alt=`Live preview from ${id}`;image.src=imageUrl;area.appendChild(image)}else if(state!=='ready'){area.textContent=state==='checking'?'Loading live frame…':'No live preview'}}
    function renderCards(){grid.innerHTML=cameraIds.map(id=>`<section id="camera-${escapeHtml(id)}" class="card idle"><div class="preview">No live preview</div><div class="body"><div class="camera">${escapeHtml(id)}</div><div class="status">Not checked</div><div class="detail">Load a preview to check this camera.</div></div></section>`).join('')}
    async function loadCamera(id){setCard(id,'checking','Connecting to the camera…');try{const response=await fetch(`/api/cameras/${encodeURIComponent(id)}/preview?nonce=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error('preview unavailable');const old=objectUrls.get(id);if(old)URL.revokeObjectURL(old);const imageUrl=URL.createObjectURL(await response.blob());objectUrls.set(id,imageUrl);const observed=response.headers.get('X-Scene-Capture-Observed-At')||response.headers.get('X-P03-Observed-At');setCard(id,'ready',observed?`Live frame received ${new Date(observed).toLocaleString()}`:'Live frame received.',imageUrl);return true}catch(_error){setCard(id,'failed','Could not load a live frame. Check this scene’s camera configuration and try again.');return false}}
    async function loadAll(){previewButton.disabled=true;setSummary(`Checking ${cameraIds.length} cameras…`);const values=await Promise.all(cameraIds.map(loadCamera));const ready=values.filter(Boolean).length;setSummary(ready===cameraIds.length?`${ready} of ${cameraIds.length} cameras are ready.`:`${ready} of ${cameraIds.length} cameras are ready. ${cameraIds.length-ready} need attention.`,ready===cameraIds.length?'success':'failure');previewButton.disabled=false;previewButton.textContent='Refresh live previews'}
    function sessionId(){return `capture-${Date.now().toString(36)}`}
    function showBundle(payload,heading='Current bundle'){if(!payload)return;const complete=payload.status==='complete-roster'&&!payload.missing_camera_ids.length;result.innerHTML=`<h2>${escapeHtml(heading)}</h2><p><code>${escapeHtml(payload.bundle_id)}</code> · ${complete?'complete':'incomplete'}</p><p>${payload.missing_camera_ids.length?`Missing: ${escapeHtml(payload.missing_camera_ids.join(', '))}`:'One frame is selected for every camera. Continue to Calibration & pose.'}</p>`;result.classList.remove('hidden')}
    async function createBundle(){if(!currentSession)return;const button=document.getElementById('bundle');button.disabled=true;try{const response=await fetch(`/api/sessions/${encodeURIComponent(currentSession)}/bundles`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bundle_id:`bundle-${Date.now().toString(36)}`})});const payload=await response.json();if(!response.ok)throw new Error(payload.detail||'bundle unavailable');showBundle(payload,'Bundle saved')}catch(error){result.innerHTML=`<h2>Bundle was not created</h2><p>${escapeHtml(error.message||'Try the capture again.')}</p>`;result.classList.remove('hidden')}finally{const button=document.getElementById('bundle');if(button)button.disabled=false}}
    async function capture(){const duration=Number(durationInput.value);if(!Number.isFinite(duration)||duration<=0||duration>30){setSummary('Choose a capture duration between 0.1 and 30 seconds.','failure');return}captureButton.disabled=true;setSummary('Capturing from the scene cameras…');try{const response=await fetch('/api/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId(),duration_seconds:duration})});const payload=await response.json();if(!response.ok)throw new Error(payload.detail||'capture unavailable');currentSession=payload.session_id;const captured=payload.results.filter(item=>item.status==='captured').length;result.innerHTML=`<h2>Capture complete</h2><p><code>${escapeHtml(payload.session_id)}</code> · ${captured} of ${payload.results.length} cameras captured.</p><p>Review any camera issues, then select a bundle.</p><button id="bundle" type="button" class="secondary">Select closest bundle</button>`;result.classList.remove('hidden');document.getElementById('bundle').addEventListener('click',createBundle);setSummary(captured===payload.results.length?'Capture completed for every camera.':'Capture completed with one or more camera failures.',captured===payload.results.length?'success':'failure')}catch(error){setSummary(error.message||'Capture could not be completed.','failure')}finally{captureButton.disabled=false}}
    async function initialise(){try{const [cameraResponse,evidenceResponse]=await Promise.all([fetch('/api/cameras',{cache:'no-store'}),fetch('/api/evidence',{cache:'no-store'})]);if(!cameraResponse.ok)throw new Error('camera roster unavailable');cameraIds=(await cameraResponse.json()).cameras;renderCards();if(evidenceResponse.ok){const evidence=await evidenceResponse.json();if(evidence.current_bundle)showBundle(evidence.current_bundle)}}catch(_error){setSummary('The camera list could not be loaded. Refresh this page to try again.','failure');previewButton.disabled=true;captureButton.disabled=true}}
    previewButton.addEventListener('click',loadAll);captureButton.addEventListener('click',capture);initialise();
  </script>
</body>
</html>
