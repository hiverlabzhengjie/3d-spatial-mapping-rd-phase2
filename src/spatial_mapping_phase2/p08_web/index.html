<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spatial Mapping Workflow</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">3D</span>
      <div><strong>Spatial mapping</strong><small>Office workflow</small></div>
    </div>
    <nav id="navigation" aria-label="Workflow pages"></nav>
    <div class="boundary-note">Runs on this computer only</div>
  </aside>
  <main>
    <header class="topbar">
      <div><p class="eyebrow">Interactive workflow</p><h1 id="page-title">Loading…</h1></div>
      <div id="scene-pill" class="scene-pill">Loading project</div>
    </header>
    <section id="notice" class="notice hidden" role="status"></section>
    <section id="step-strip" class="step-strip" aria-label="Workflow progress"></section>
    <section id="content" class="content-grid"></section>
  </main>
  <script src="/assets/app.js" defer></script>
</body>
</html>
