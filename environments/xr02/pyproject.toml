[project]
name = "phase2-xr02-runtime"
version = "0.1.0"
description = "Pinned Windows/CUDA runtime substrate for Phase 2 XR02 tracking"
requires-python = ">=3.11,<3.12"
dependencies = [
    "av==16.0.1",
    "boxmot==21.0.0",
    "click==8.2.1",
    "defusedxml==0.7.1",
    "filterpy==1.4.5",
    "gdown==5.2.0",
    "huggingface-hub==1.7.1",
    "lapx==0.9.2",
    "numpy==2.2.6",
    "opencv-python==4.11.0.86",
    "pandas==2.3.0",
    "pydeprecate==0.11.0",
    "rerun-sdk==0.22.1",
    "rich==15.0.0",
    "scikit-learn==1.7.0",
    "scipy==1.17.1",
    "supervision==0.30.0",
    "timm==1.0.15",
    "torch==2.4.1+cu124",
    "torchvision==0.19.1+cu124",
    "ultralytics==8.4.123",
]

[tool.uv]
package = false
required-version = "==0.12.7"
environments = ["sys_platform == 'win32'"]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
boxmot = { git = "https://github.com/mikel-brostrom/boxmot.git", rev = "8f8babc5302024b13db7e7faeb50b3da55d1e815" }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
