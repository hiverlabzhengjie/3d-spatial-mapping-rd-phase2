[project]
name = "phase2-da3-runtime"
version = "0.1.0"
description = "Pinned Windows/CUDA runtime substrate for Phase 2 DA3 inference"
requires-python = ">=3.11,<3.12"
dependencies = [
    "addict==2.4.0",
    "e3nn==0.6.0",
    "einops==0.8.2",
    "evo==1.37.0",
    "huggingface-hub==0.22.2",
    "imageio==2.37.4",
    "moviepy==1.0.3",
    "numpy==1.26.4",
    "omegaconf==2.3.1",
    "open3d==0.19.0",
    "opencv-python==4.11.0.86",
    "pillow==12.3.0",
    "pillow-heif==1.5.0",
    "plyfile==1.0.3",
    "psutil==7.0.0",
    "pyarrow==25.0.1",
    "pycolmap==4.1.1",
    "requests==2.31.0",
    "rerun-sdk==0.22.1",
    "safetensors==0.4.5",
    "scipy==1.17.1",
    "torch==2.4.1+cu124",
    "torchvision==0.19.1+cu124",
    "trimesh==5.0.0",
    "typer==0.12.0",
]

[tool.uv]
package = false
required-version = "==0.12.7"
environments = ["sys_platform == 'win32'"]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
