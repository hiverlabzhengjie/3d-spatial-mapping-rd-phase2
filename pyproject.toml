[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "spatial-mapping-phase2"
version = "0.1.0"
description = "Low-touch, facility-coordinate DA3 reconstruction from fixed CCTV cameras"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.141,<1",
    "numpy>=2.2,<3",
    "opencv-python>=4.11,<5",
    "pymupdf>=1.24,<2",
    "scipy>=1.15,<2",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
tracking = [
    "av==16.0.1",
    "rerun-sdk==0.22.1",
    "supervision==0.30.0",
    "ultralytics==8.4.123",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_mapping_phase2"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
packages = ["spatial_mapping_phase2"]
