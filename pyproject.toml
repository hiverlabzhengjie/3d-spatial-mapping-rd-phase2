[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "spatial-mapping-phase2"
version = "0.1.0"
description = "Low-touch, facility-coordinate DA3 reconstruction from fixed CCTV cameras"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.141,<1",
    "numpy>=1.26,<2",
    "opencv-python>=4.11,<5",
    "scipy>=1.17,<2",
    "tzdata>=2026.3,<2027",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
facility = ["pymupdf>=1.24,<2"]
geometry = ["open3d>=0.19,<0.20"]
live-capture = ["av>=18,<19"]

[project.scripts]
phase2-console = "spatial_mapping_phase2.console_cli:main"
phase2-xr02-worker = "spatial_mapping_phase2.xr02_worker_cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.12,<3",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.uv]
required-version = "==0.12.7"
constraint-dependencies = [
    "av==18.0.0",
    "fastapi==0.141.1",
    "httpx2==2.12.0",
    "mypy==1.15.0",
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "open3d==0.19.0",
    "pymupdf==1.24.1",
    "pytest==8.3.5",
    "pytest-cov==6.0.0",
    "ruff==0.11.13",
    "scipy==1.17.1",
    "tzdata==2026.3",
    "uvicorn==0.52.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_mapping_phase2"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
packages = ["spatial_mapping_phase2"]

[[tool.mypy.overrides]]
module = ["rerun", "rerun.*", "torch", "torch.*"]
ignore_missing_imports = true
